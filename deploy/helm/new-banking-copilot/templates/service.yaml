apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.frontendPort }}
    targetPort: frontend
    protocol: TCP
    name: frontend
  - port: {{ .Values.service.backendPort }}
    targetPort: backend
    protocol: TCP
    name: backend
  selector:
    app: {{ .Chart.Name }}
